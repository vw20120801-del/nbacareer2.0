            var curParsed = cur ? JSON.parse(cur) : {};
            var curN = Object.keys(curParsed).length;
            var newN = Object.keys(data).length;
            if (!confirm("确认导入存档？\n当前 " + curN + " 个 / 文件 " + newN + " 个\n确定 = 合并（同名覆盖），取消 = 放弃")) return;
            localStorage.setItem(KEY, JSON.stringify(Object.assign({}, curParsed, data)));
            alert("导入成功，页面即将刷新");
            location.reload();
          } catch (e) {
            alert("导入失败：" + e.message);
          }
        };
        r.readAsText(file);
      };
      window.__nbaDownloadLocal = function () {
        fetch("./nbacareer-local.html", { cache: "no-cache" })
          .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); })
          .then(function (blob) {

            a.href = URL.createObjectURL(blob);
            a.download = "nbacareer-local.html";
            document.body.appendChild(a); a.click(); a.remove();

            }, 600);
          })

      };
